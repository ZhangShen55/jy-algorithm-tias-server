IMAGE_ROOT = "/mnt/ias-images"
INSTANCE_COUNT = 1
WORKERS_PER_INSTANCE = 1
GPU_ID = "cpu"

[Person_Thresd]
Head = 0.25
Top_Head = 0.1
Hat = 0.1
Headphones = 0.1
Shoulder = 0.1

[Face_Thresd]
face = 0.1

[Student_Thresd]
phone = 0.7
hand = 0.99
sleep = 0.5
stand = 0.99
read = 0.5

[Teacher_Behavior_Thresd]
# 同一主体多类别框的高重叠合并阈值，主要用于兼容旧逻辑和结果聚合。
MergeIoU = 0.8
# 主体聚类 IoU 阈值；用于把同一老师的姿态框和授课行为框合成一个主体。
SubjectClusterIoU = 0.45
# teacher_behavior.pt 推理尺寸。
ImageSize = 640

sit = 0.4
stand = 0.4
bbwriting = 0.25
teach = 0.25

# 是否只保留一个主老师主体。
KeepOnlyMainSubject = true
# 主体选择策略。posture_confidence 表示优先按 sit/stand 姿态置信度选择老师主体。
MainSubjectStrategy = "posture_confidence"

# sit 与 stand 同时过阈值时的置信度差值比例阈值；差值比例 <= 该值时认为冲突不明显。
PostureConflictRatio = 0.10

# sit 与 stand 冲突不明显时的默认姿态；当前业务要求非坐即站，默认按 stand 输出。
PostureConflictDefault = "stand"

# 主体存在但 sit/stand 都未过阈值时，是否强制输出默认姿态并标记 PostureFallback。
ForcePostureWhenMissing = true

[Teacher_Head_Pose]
# 头部姿态检测总开关。false 时不加载 DirectMHP，ReturnHeadPose=true 也不会返回 HeadPoseResult。
Enabled = false
# DirectMHP 源码目录；支持绝对路径，也支持相对项目根目录的路径。
DirectMHPRoot = "app/vendor/DirectMHP"
# DirectMHP 权重文件；当前默认使用 m 模型。
DirectMHPWeights = "app/models/cmu_m_1280_e200_t40_lw010_best.pt"
# DirectMHP 数据配置文件。
DirectMHPData = "app/models/cmu_panoptic_coco.yaml"
# DirectMHP 推理设备。Mac 本地用 cpu；NVIDIA GPU 环境可配置为 "0"。
Device = "cpu"
# DirectMHP 推理尺寸。
ImageSize = 1280
# DirectMHP 头部检测置信度阈值。
ConfThres = 0.35
# DirectMHP NMS IoU 阈值。
IouThres = 0.45
# 老师主体框 crop 扩展比例。
CropScale = 1.35
# 学生视角左右方向阈值；Yaw <= -阈值为 left，Yaw >= 阈值为 right。
SideYawThreshold = 20.0
# 低头阈值；Pitch >= 阈值时 IsLookingDown=true。
DownPitchThreshold = 20.0

[AI_Quality]
# Kafka 可按本地 Docker 或测试环境覆盖；测试环境地址当前为 10.67.65.8:9092。
KafkaBootstrapServers = "10.67.65.8:9092"
KafkaTopic = "classroom_asr_task"
KafkaGroupId = "cv-analysis-service"

# ai_quality 测试库连接配置。
DBHost = "10.67.65.8"
DBPort = 23308
DBUser = "root"
DBPassword = "123456"
#DBName = "ai_quality"
DBName = "ai_quality_eval"

# 本地/生产抓拍根目录。当前 NFS 不可写时，本地使用项目内 blobstor/image 替代。
SnapshotMountRoot = "/Users/zhangshen/Documents/workspace/jy-algorithm-tias-server/blobstor/image"
SnapshotRelativePrefix = "cv"
SnapshotScale = 0.25
# 每节课最多保存多少条核心课堂快照事件，避免报告和存储膨胀。
SnapshotMaxTotal = 30
# 学生抬头高峰：按抬头率取最高 N 张，再按最低抬头率过滤。
SnapshotHeadUpTopK = 3
SnapshotHeadUpMinRate = 0.70
# 学生阅读专注：按 Read_W / present_count 取最高 N 张，再按最低阅读占比过滤。
SnapshotReadTopK = 3
SnapshotReadMinRate = 0.30
# 学生睡觉：满足睡觉人数或睡觉占比任一阈值即进入候选。
SnapshotSleepMinCount = 2
SnapshotSleepMinRate = 0.05
# 学生玩手机：满足玩手机人数或玩手机占比任一阈值即进入候选。
SnapshotPhoneMinCount = 2
SnapshotPhoneMinRate = 0.05
# 教师教态预警：连续 N 个有效教师帧非面向学生或低头时保存。
SnapshotTeacherAlertConsecutiveFrames = 3
# 同类快照最小间隔秒数，避免相邻帧重复入库。
SnapshotSameTypeMinIntervalSeconds = 90
# 学生异常行为统计：跳过课程开始前 N 分钟，避免课前准备画面污染统计。
BehaviorStatStartMinute = 3
# 学生异常行为统计：peak_period_desc 最多保留多少个高峰候选段。
BehaviorStatPeakMaxSegments = 5

# Worker 运行参数。
TempRoot = "/tmp/ai-quality"
FrameIntervalSeconds = 30
MaxTaskRetries = 3
WorkerConcurrency = 1
DefaultStudentCount = 50
# 本地联调大视频时可设置为 1，只抽每路视频第一帧；生产建议注释或设为 0。
MaxFramesPerVideo = 0
