services:
  vbas-gpu-8981:
    networks:
      default:
        aliases:
          - vbas-8981

    # build:
    #   context: ../..
    #   dockerfile: vbas/docker/Dockerfile
    image: vbas:6.0-protected
    container_name: vbas-gpu-8981
    shm_size: "2g"
    command: python -m uvicorn vbas.main:app --host 0.0.0.0 --port 8981
    env_file:
      - ./env.example
    environment:
      CONFIG_PATH: /workspace/vbas/config.toml
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8981:8981"
    volumes:
      - ./examples/vbas-8981.toml:/workspace/vbas/config.toml:ro
      - ../models:/workspace/vbas/models:ro
      - ../models-encrypted:/workspace/vbas/models-encrypted:ro
      - ./secrets/vbas_model_key:/run/secrets/vbas_model_key:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vbas-gpu-8982:
    networks:
      default:
        aliases:
          - vbas-8982
    # build:
    #   context: ../..
    #   dockerfile: vbas/docker/Dockerfile
    image: vbas:6.0-protected
    container_name: vbas-gpu-8982
    shm_size: "2g"
    command: python -m uvicorn vbas.main:app --host 0.0.0.0 --port 8982
    env_file:
      - ./env.example
    environment:
      CONFIG_PATH: /workspace/vbas/config.toml
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8982:8982"
    volumes:
      - ./examples/vbas-8982.toml:/workspace/vbas/config.toml:ro
      - ../models:/workspace/vbas/models:ro
      - ../models-encrypted:/workspace/vbas/models-encrypted:ro
      - ./secrets/vbas_model_key:/run/secrets/vbas_model_key:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  default:
    external: true
    name: vision-orchestrator-net
