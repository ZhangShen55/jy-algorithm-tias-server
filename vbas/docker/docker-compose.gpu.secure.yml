services:
  vbas-gpu-8981:
    build:
      context: ../..
      dockerfile: vbas/docker/Dockerfile.runtime
    image: vbas:6.0-secure
    container_name: vbas-gpu-8981-secure
    shm_size: "2g"
    command: python -m uvicorn vbas.main:app --host 0.0.0.0 --port 8981
    env_file:
      - ./env.example
    environment:
      CONFIG_PATH: /workspace/vbas/config.toml
      VBAS_BOOTSTRAP_KEY_FILE: /run/bootstrap-secrets/vbas_model_key
      VBAS_RUNTIME_KEY_FILE: /dev/shm/vbas_model_key
      VBAS_RUNTIME_KEY_ROOT: /dev/shm
      VBAS_REQUIRE_BOOTSTRAP_KEY: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8981:8981"
    volumes:
      - ./examples/vbas-8981.secure.toml:/workspace/vbas/config.toml:ro
      - ../models-encrypted:/workspace/vbas/models-encrypted:ro
      - ./secrets/vbas_model_key:/run/bootstrap-secrets/vbas_model_key:ro
    networks:
      default:
        aliases:
          - vbas-8981
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vbas-gpu-8982:
    image: vbas:6.0-secure
    container_name: vbas-gpu-8982-secure
    shm_size: "2g"
    command: python -m uvicorn vbas.main:app --host 0.0.0.0 --port 8982
    env_file:
      - ./env.example
    environment:
      CONFIG_PATH: /workspace/vbas/config.toml
      VBAS_BOOTSTRAP_KEY_FILE: /run/bootstrap-secrets/vbas_model_key
      VBAS_RUNTIME_KEY_FILE: /dev/shm/vbas_model_key
      VBAS_RUNTIME_KEY_ROOT: /dev/shm
      VBAS_REQUIRE_BOOTSTRAP_KEY: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8982:8982"
    volumes:
      - ./examples/vbas-8982.secure.toml:/workspace/vbas/config.toml:ro
      - ../models-encrypted:/workspace/vbas/models-encrypted:ro
      - ./secrets/vbas_model_key:/run/bootstrap-secrets/vbas_model_key:ro
    networks:
      default:
        aliases:
          - vbas-8982
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  default:
    external: true
    name: vision-orchestrator-net
