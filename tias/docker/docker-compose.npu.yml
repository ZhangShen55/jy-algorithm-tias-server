services:
  tias-npu-8882:
    image: tias_910b_npu:v6.0_260709
    container_name: tias-npu-8882
    shm_size: "2g"
    command: python -m uvicorn tias.main:app --host 0.0.0.0 --port 8882
    environment:
      CONFIG_PATH: /workspace/tias/config.toml
      ASCEND_TOOLKIT_HOME: /usr/local/Ascend/ascend-toolkit/latest
      ASCEND_HOME_PATH: /usr/local/Ascend/ascend-toolkit/latest
      ASCEND_OPP_PATH: /usr/local/Ascend/ascend-toolkit/latest/opp
      ASCEND_AICPU_PATH: /usr/local/Ascend/ascend-toolkit/latest
      LD_LIBRARY_PATH: /usr/local/Ascend/ascend-toolkit/latest/lib64:/usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver
    ports:
      - "8882:8882"
    volumes:
      - ./examples/tias-npu-8882.secure.toml:/workspace/tias/config.toml:ro
      - ../models-encrypted:/workspace/tias/models-encrypted:ro
      - ../models/cmu_panoptic_coco.yaml:/workspace/tias/model-assets/cmu_panoptic_coco.yaml:ro
      - ./secrets/tias_model_key:/dev/shm/tias_model_key:ro
      - /usr/local/Ascend:/usr/local/Ascend:ro
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci1:/dev/davinci1
      - /dev/davinci2:/dev/davinci2
      - /dev/davinci3:/dev/davinci3
      - /dev/davinci4:/dev/davinci4
      - /dev/davinci5:/dev/davinci5
      - /dev/davinci6:/dev/davinci6
      - /dev/davinci7:/dev/davinci7
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    networks:
      default:
        aliases:
          - tias-npu-8882

